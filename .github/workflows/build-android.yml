name: Build OMNIX Android APK

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "connectors.html"
      - "package.json"
      - "capacitor.config.json"
      - "www/**"
      - ".github/workflows/build-android.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package.json

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"

      - name: Accept Android SDK licenses and install required packages
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Install dependencies
        run: npm install

      - name: Generate Android project
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Prepare named APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk OMNIX.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: OMNIX-Android-APK
          path: OMNIX.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish APK download release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: omnix-android-${{ github.run_number }}
          name: OMNIX Android Build ${{ github.run_number }}
          files: OMNIX.apk
          generate_release_notes: true
