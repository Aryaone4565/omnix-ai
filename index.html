<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OMNIX AI</title>
<style>
* { box-sizing: border-box; }
body { margin: 0; background: #090b10; color: #f4f4f5; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Color Emoji", "Apple Color Emoji", "Segoe UI Emoji", Arial, sans-serif; min-height: 100vh; display: flex; flex-direction: column; }
.assistant p { margin: 0 0 12px; }
.assistant p:last-child { margin-bottom: 0; }
.assistant h1, .assistant h2, .assistant h3, .assistant h4 { line-height: 1.35; margin: 20px 0 10px; font-weight: 750; letter-spacing: -.02em; }
.assistant h1 { font-size: 1.5rem; }
.assistant h2 { font-size: 1.3rem; }
.assistant h3 { font-size: 1.12rem; }
.assistant h1:first-child, .assistant h2:first-child, .assistant h3:first-child { margin-top: 0; }
.assistant ul, .assistant ol { padding-left: 1.45rem; margin: 8px 0 14px; }
.assistant li { margin: 5px 0; }
.assistant blockquote { margin: 12px 0; padding: 8px 13px; border-left: 3px solid #8b5cf6; color: #d4d4d8; background: #1b1d2a; border-radius: 0 8px 8px 0; }
.assistant a { color: #7dd3fc; text-decoration: underline; text-underline-offset: 3px; }
.assistant hr { border: 0; border-top: 1px solid #343846; margin: 16px 0; }
.assistant strong { color: #fff; font-weight: 750; }
.assistant :not(pre) > code { font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace; font-size: .9em; background: #252938; color: #c4b5fd; padding: 2px 6px; border-radius: 6px; }
.assistant pre { overflow-x: auto; max-width: 100%; margin: 12px 0; padding: 14px; border: 1px solid #343846; border-radius: 11px; background: #0b0e14; line-height: 1.55; }
.assistant pre code { font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace; font-size: 13px; white-space: pre; }
.assistant table { border-collapse: collapse; width: 100%; display: block; overflow-x: auto; margin: 12px 0; }
.assistant th, .assistant td { border: 1px solid #343846; padding: 8px 10px; text-align: left; }
.assistant th { background: #202433; }
@media (max-width: 520px) { .message { padding: 13px 14px; } .assistant pre { padding: 10px; } .assistant pre code { font-size: 12px; } }
header { padding: 18px; border-bottom: 1px solid #252832; display: flex; align-items: center; justify-content: space-between; }
.logo { font-size: 23px; font-weight: bold; letter-spacing: 4px; background: linear-gradient(90deg, #a78bfa, #38bdf8); color: transparent; background-clip: text; }
.status { font-size: 11px; color: #a1a1aa; }
main { flex: 1; overflow-y: auto; padding: 20px; }
.welcome { text-align: center; margin: 15vh auto 35px; }
.orb { width: 75px; height: 75px; border-radius: 50%; margin: auto auto 25px; background: radial-gradient(circle at 30% 30%, #38bdf8, #6d28d9 55%, #090b10); box-shadow: 0 0 45px #6d28d955; }
h1 { font-size: 32px; margin-bottom: 10px; }
.subtitle { color: #a1a1aa; line-height: 1.6; }
.suggestions { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; max-width: 500px; margin: 25px auto; }
.suggestions button { background: #151821; color: #d4d4d8; border: 1px solid #292d3a; padding: 12px; border-radius: 12px; cursor: pointer; }
#messages { max-width: 700px; margin: auto; }
.message { padding: 14px 16px; border-radius: 15px; margin: 12px 0; line-height: 1.6; white-space: pre-wrap; overflow-wrap: anywhere; }
.user { background: #24243a; margin-left: 12%; }
.assistant { background: #14171e; border: 1px solid #292d35; margin-right: 5%; }
footer { padding: 14px; border-top: 1px solid #252832; }
.composer { max-width: 700px; margin: auto; display: flex; gap: 10px; background: #151821; border: 1px solid #343846; border-radius: 16px; padding: 8px; }
textarea { flex: 1; min-width: 0; resize: none; height: 45px; max-height: 120px; background: transparent; color: white; border: none; outline: none; padding: 12px 8px; font: inherit; }
#send { width: 45px; border: none; border-radius: 12px; background: #8b5cf6; color: white; font-size: 20px; cursor: pointer; }
#send:disabled { opacity: .55; cursor: wait; }
.memory-tools { max-width: 700px; margin: 0 auto 8px; display:flex; gap:8px; justify-content:flex-end; flex-wrap:wrap; }
.memory-tools button { background:#151821; color:#c4b5fd; border:1px solid #343846; padding:7px 10px; border-radius:9px; font-size:12px; cursor:pointer; }
.note { text-align: center; color: #71717a; font-size: 11px; margin-top: 10px; }
button:active { transform: scale(.97); }
</style>
</head>
<body>
<header>
  <div class="logo">OMNIX</div>
  <div class="status" id="status">● CONNECTING TO AI</div>
</header>
<main id="chat">
  <section class="welcome" id="welcome">
    <div class="orb"></div>
    <h1>Think beyond.</h1>
    <p class="subtitle">Your ideas. Your questions.<br>One intelligent workspace.</p>
    <div class="suggestions">
      <button onclick="suggest('Help me learn coding')">💻 Learn coding</button>
      <button onclick="suggest('Explain artificial intelligence')">🧠 Explore AI</button>
      <button onclick="suggest('Help me build a website')">🌐 Build a website</button>
      <button onclick="suggest('Give me an interesting space fact')">🚀 Explore space</button>
    </div>
  </section>
  <div id="messages" aria-live="polite"></div>
</main>
<footer>
  <div class="memory-tools"><button type="button" onclick="memoryAction('show')">🧠 My memories</button><button type="button" onclick="memoryAction('clear')">Forget memories</button></div>
  <div class="composer">
    <textarea id="input" placeholder="Ask OMNIX anything..." rows="1" aria-label="Message"></textarea>
    <button id="send" aria-label="Send message">↑</button>
  </div>
  <div class="note">OMNIX can make mistakes. Verify important information.</div>
</footer>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.2.6/purify.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.10.0/highlight.min.js"></script>
<script>
const API_URL = "https://omnix-brain.aryaone4565.workers.dev";
const input = document.getElementById("input");
const messages = document.getElementById("messages");
const welcome = document.getElementById("welcome");
const send = document.getElementById("send");
const statusLabel = document.getElementById("status");
const conversation = [];
const USER_ID_KEY = "omnix_persistent_user_id_v1";
function getUserId() {
  let id = localStorage.getItem(USER_ID_KEY);
  if (!id) {
    id = crypto.randomUUID ? crypto.randomUUID() : "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g, c => { const r = Math.random()*16|0; return (c==="x"?r:(r&3|8)).toString(16); });
    localStorage.setItem(USER_ID_KEY, id);
  }
  return id;
}
const userId = getUserId();

function suggest(text) {
  input.value = text;
  input.focus();
}

if (window.marked) marked.setOptions({ gfm: true, breaks: true });

function renderAssistantContent(element, text) {
  if (window.marked && window.DOMPurify) {
    const rawHtml = marked.parse(String(text || ""));
    element.innerHTML = DOMPurify.sanitize(rawHtml, {
      USE_PROFILES: { html: true },
      FORBID_TAGS: ["style", "script", "iframe", "object", "embed", "form"],
      FORBID_ATTR: ["style", "onerror", "onclick", "onload"]
    });
    if (window.hljs) {
      element.querySelectorAll("pre code").forEach(block => {
        try { hljs.highlightElement(block); } catch (_) {}
      });
    }
  } else {
    element.textContent = String(text || "");
  }
}

function addMessage(text, type) {
  const message = document.createElement("div");
  message.className = "message " + type;
  if (type === "assistant") renderAssistantContent(message, text);
  else message.textContent = text;
  messages.appendChild(message);
  document.getElementById("chat").scrollTop = document.getElementById("chat").scrollHeight;
  return message;
}

async function submitMessage() {
  const text = input.value.trim();
  if (!text || send.disabled) return;

  welcome.style.display = "none";
  addMessage(text, "user");
  conversation.push({ role: "user", content: text });
  input.value = "";
  send.disabled = true;
  statusLabel.textContent = "● OMNIX IS THINKING";
  const pending = addMessage("Thinking…", "assistant");

  try {
    const response = await fetch(API_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ userId, messages: conversation.slice(-20) })
    });

    const data = await response.json().catch(() => ({}));
    if (!response.ok) {
      throw new Error(data.error || "The AI service returned an error (" + response.status + ").");
    }
    if (typeof data.reply !== "string" || !data.reply.trim()) {
      throw new Error("OMNIX received an empty response. Please try again.");
    }

    renderAssistantContent(pending, data.reply);
    conversation.push({ role: "assistant", content: data.reply });
    statusLabel.textContent = "● AI ONLINE";
  } catch (error) {
    pending.textContent = "Couldn't reach OMNIX AI. Check your internet connection and try again. (" + (error.message || "Network error") + ")";
    statusLabel.textContent = "● CONNECTION ISSUE";
  } finally {
    send.disabled = false;
    input.focus();
    document.getElementById("chat").scrollTop = document.getElementById("chat").scrollHeight;
  }
}

async function memoryAction(action) {
  const message = action === "show" ? "Show my saved memories" : "Forget all my saved memories";
  if (action === "clear" && !confirm("Delete all saved memories for this browser? This cannot be undone.")) return;
  welcome.style.display = "none";
  addMessage(message, "user");
  send.disabled = true;
  statusLabel.textContent = "● CHECKING MEMORY";
  const pending = addMessage("Checking memory…", "assistant");
  try {
    const response = await fetch(API_URL, { method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({userId, message}) });
    const data = await response.json();
    if (!response.ok) throw new Error(data.error || "Memory request failed.");
    pending.textContent = data.reply;
    statusLabel.textContent = "● AI ONLINE";
  } catch (error) {
    pending.textContent = "Could not access memory: " + (error.message || "Network error");
    statusLabel.textContent = "● CONNECTION ISSUE";
  } finally {
    send.disabled = false;
    input.focus();
  }
}
send.addEventListener("click", submitMessage);
input.addEventListener("keydown", function(event) {
  if (event.key === "Enter" && !event.shiftKey) {
    event.preventDefault();
    submitMessage();
  }
});
</script>
</body>
</html>
